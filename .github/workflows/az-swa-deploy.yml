name: Azure Static Web Apps Deploy

# ⚠️ 已暂停：Azure 上的 Static Web App 资源已被删除（2026-08），部署失败
# （"No matching Static Web App was found or the api key was invalid"）。
# 恢复步骤：
#   1. 在 Azure 门户重新创建 Static Web App 并关联本仓库；
#   2. 复制新的 Deployment Token，更新 GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN；
#   3. 取消下方 push 触发器的注释。
on:
    workflow_dispatch:
    # push:
    #   branches:
    #     - main
    #   paths:
    #     - 'website/**'
    #     - '.github/workflows/az-swa-deploy.yml'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "website" # App source code path relative to repository root
          output_location: "build" # Built app content directory, relative to app_location - optional
          ###### End of Repository/Build Configurations ######
